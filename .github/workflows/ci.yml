name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        env:
          # Provide stub values so env validation doesn't throw at type-check time
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_STARTER: price_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_PRO: price_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE: price_placeholder
          RESEND_API_KEY: re_placeholder
          RESEND_FROM_EMAIL: hello@sintrics.ai
          NEXT_PUBLIC_APP_URL: https://sintrics.ai

      - name: Lint
        run: npm run lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_STARTER: price_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_PRO: price_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE: price_placeholder
          RESEND_API_KEY: re_placeholder
          RESEND_FROM_EMAIL: hello@sintrics.ai
          NEXT_PUBLIC_APP_URL: https://sintrics.ai

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_STARTER: price_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_PRO: price_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE: price_placeholder
          RESEND_API_KEY: re_placeholder
          RESEND_FROM_EMAIL: hello@sintrics.ai
          NEXT_PUBLIC_APP_URL: https://sintrics.ai
